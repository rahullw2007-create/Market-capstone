<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Rahul Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Rahul<span class="logo-badge">MART</span>
            </a>
            <ul class="nav-links" id="navbar-links"></ul>
        </nav>
    </header>

    <div class="container" id="product-detail-container">
        <!-- Dynamically rendered -->
    </div>

    <!-- Floating Chatbot Widget -->
    <button onclick="toggleChatWidget()" class="chat-widget-btn" title="Chat with RahulBot">💬</button>
    <div id="chat-modal" class="chat-modal">
        <div class="chat-header">
            <span>RahulBot Assistant</span>
            <button onclick="toggleChatWidget()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.1rem;">✕</button>
        </div>
        <div id="chat-body" class="chat-body">
            <div class="chat-msg bot">Hi! Have a question about this product? Ask RahulBot!</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message...">
            <button onclick="sendChatMessage()" class="btn btn-primary btn-sm">Send</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rahul Mart Multi-Vendor Marketplace</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
        let currentProductId = null;

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            currentProductId = urlParams.get('id');
            const container = document.getElementById('product-detail-container');

            if (!currentProductId) {
                container.innerHTML = `<div style="text-align: center; padding: 3rem;">Product not specified. <a href="index.html">Back to Catalogue</a></div>`;
                return;
            }

            try {
                const res = await apiCall(`/catalog/products/${currentProductId}`);
                const prod = res.data;
                const user = await getCurrentUser();

                const reviewsRes = await apiCall(`/reviews/product/${currentProductId}`);
                const reviews = reviewsRes.data;

                let html = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; background: #fff; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 2.5rem;">
                        <div>
                            <img src="${prod.imageUrl || 'https://via.placeholder.com/500'}" style="width: 100%; max-height: 420px; object-fit: cover; border-radius: var(--radius-md);" />
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <span class="badge badge-active" style="width: fit-content; margin-bottom: 0.5rem;">${escapeHtml(prod.category)}</span>
                            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${escapeHtml(prod.name)}</h1>
                            <div style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;">
                                Sold by <strong>${escapeHtml(prod.vendorName)}</strong> (Vendor ID #${prod.vendorId})
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--accent); margin-bottom: 1.25rem;">
                                <span style="font-size: 1.2rem; font-weight: 700;">★ ${prod.averageRating ? prod.averageRating.toFixed(1) : 'New'}</span>
                                <span style="color: var(--text-muted);">(${prod.reviewCount || 0} reviews)</span>
                            </div>
                            <div style="font-size: 2rem; font-weight: 800; color: var(--dark); margin-bottom: 1.25rem;">
                                ${formatCurrency(prod.price)}
                            </div>
                            <p style="color: var(--text-primary); margin-bottom: 1.5rem; line-height: 1.7;">
                                ${escapeHtml(prod.description)}
                            </p>
                            <div style="margin-bottom: 1.5rem;">
                                <strong>Availability:</strong> 
                                <span style="color: ${prod.quantity > 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">
                                    ${prod.quantity > 0 ? `In Stock (${prod.quantity} available)` : 'Out of Stock'}
                                </span>
                            </div>

                            ${prod.quantity > 0 ? `
                                <div style="display: flex; gap: 1rem; align-items: center; margin-top: auto;">
                                    <input type="number" id="buy-qty" value="1" min="1" max="${prod.quantity}" class="form-control" style="width: 90px;">
                                    <button onclick="addToCart(${prod.id})" class="btn btn-primary" style="flex: 1;">Add to Shopping Cart</button>
                                </div>
                            ` : `
                                <button class="btn btn-secondary" disabled style="width: 100%;">Currently Unavailable</button>
                            `}
                        </div>
                    </div>

                    <!-- Reviews Section -->
                    <div style="background: #fff; padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                        <h3 style="margin-bottom: 1.5rem;">Customer Reviews</h3>

                        ${user && user.role === 'CUSTOMER' ? `
                            <div style="background: var(--light-bg); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem;">
                                <h4>Write a Verified Purchase Review</h4>
                                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Reviews are allowed only for customers with delivered orders for this item.</p>
                                <form onsubmit="submitReview(event)">
                                    <div class="form-group">
                                        <label for="review-rating">Rating (1 to 5 Stars)</label>
                                        <select id="review-rating" class="form-control" style="width: 150px;" required>
                                            <option value="5">5 ★★★★★ Excellent</option>
                                            <option value="4">4 ★★★★☆ Very Good</option>
                                            <option value="3">3 ★★★☆☆ Average</option>
                                            <option value="2">2 ★★☆☆☆ Below Average</option>
                                            <option value="1">1 ★☆☆☆☆ Poor</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="review-comment">Your Review</label>
                                        <textarea id="review-comment" class="form-control" rows="3" placeholder="Write your honest experience with this product..." required minlength="5"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm">Submit Verified Review</button>
                                </form>
                            </div>
                        ` : ''}

                        <div id="reviews-list">
                            ${reviews.length === 0 ? '<p style="color: var(--text-muted);">No reviews yet for this product.</p>' : 
                                reviews.map(r => `
                                    <div style="border-bottom: 1px solid var(--border-color); padding: 1rem 0;">
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                                            <span style="font-weight: 600;">${escapeHtml(r.customerName)}</span>
                                            <span style="color: var(--accent); font-weight: 700;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                                        </div>
                                        <p style="color: var(--text-primary); margin-bottom: 0.4rem;">${escapeHtml(r.comment)}</p>
                                        <div style="font-size: 0.75rem; color: var(--text-muted);">${formatDate(r.createdAt)}</div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div style="color: var(--danger); text-align: center;">Error: ${e.message}</div>`;
            }
        }

        async function addToCart(productId) {
            const user = await getCurrentUser();
            if (!user) {
                showToast('Please log in to add items to cart', 'info');
                setTimeout(() => window.location.href = 'login.html', 800);
                return;
            }
            if (user.role !== 'CUSTOMER') {
                showToast('Only Customer accounts can add items to cart', 'error');
                return;
            }

            const qtyInput = document.getElementById('buy-qty');
            const quantity = parseInt(qtyInput ? qtyInput.value : 1);

            try {
                await apiCall('/basket/items', 'POST', { productId, quantity });
                showToast('Item added to cart!', 'success');
                renderHeader();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function submitReview(event) {
            event.preventDefault();
            const rating = parseInt(document.getElementById('review-rating').value);
            const comment = document.getElementById('review-comment').value;

            try {
                await apiCall('/reviews', 'POST', { productId: parseInt(currentProductId), rating, comment });
                showToast('Review submitted successfully!', 'success');
                loadProductDetail();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
