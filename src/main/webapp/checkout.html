<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Rahul Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Rahul<span class="logo-badge">MART</span>
            </a>
            <ul class="nav-links" id="navbar-links"></ul>
        </nav>
    </header>

    <div class="container" id="checkout-container">
        <!-- Dynamically rendered -->
    </div>

    <footer>
        <p>&copy; 2026 Rahul Mart Multi-Vendor Marketplace</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        async function loadCheckoutPage() {
            const container = document.getElementById('checkout-container');
            const user = await getCurrentUser();
            if (!user || user.role !== 'CUSTOMER') {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await apiCall('/basket');
                const cart = res.data;

                if (!cart.items || cart.items.length === 0) {
                    window.location.href = 'cart.html';
                    return;
                }

                let html = `
                    <h2 style="margin-bottom: 1.5rem;">Order Checkout</h2>
                    <div style="display: grid; grid-template-columns: 1.8fr 1fr; gap: 2rem;">
                        <div>
                            <!-- Shipping & Payment Form -->
                            <div style="background: #fff; padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 1.5rem;">
                                <h3 style="margin-bottom: 1.25rem;">1. Shipping Information</h3>
                                <div class="form-group">
                                    <label for="shippingAddress">Delivery Address</label>
                                    <textarea id="shippingAddress" class="form-control" rows="3" placeholder="123 Fifth Avenue, Apt 4B, New York, NY 10001" required>123 Main Street, Suite 100, New York, NY 10001</textarea>
                                </div>
                            </div>

                            <div style="background: #fff; padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                                <h3 style="margin-bottom: 1.25rem;">2. Simulated Payment Method</h3>
                                <div class="form-group">
                                    <label><input type="radio" name="paymentMethod" value="SIMULATED_CARD" checked> Simulated Credit / Debit Card (No charge)</label>
                                </div>
                                <div class="form-group">
                                    <label><input type="radio" name="paymentMethod" value="SIMULATED_PAYPAL"> Simulated Digital Wallet</label>
                                </div>
                                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
                                    🔒 Server performs exact transaction price & stock verification in one atomic ACID database transaction.
                                </p>
                            </div>
                        </div>

                        <div>
                            <!-- Order Items Breakdown -->
                            <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                                <h3 style="margin-bottom: 1.25rem;">Review Items (${cart.totalItemsCount})</h3>
                                <div style="display: flex; flex-direction: column; gap: 1rem; max-height: 300px; overflow-y: auto; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                                    ${cart.items.map(item => `
                                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                                            <div>
                                                <strong style="color: var(--dark);">${escapeHtml(item.product.name)}</strong>
                                                <div style="font-size: 0.8rem; color: var(--text-muted);">${item.quantity} × ${formatCurrency(item.product.price)}</div>
                                            </div>
                                            <span style="font-weight: 600;">${formatCurrency(item.subtotal)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 1.5rem;">
                                    <span>Grand Total</span>
                                    <span style="color: var(--primary);">${formatCurrency(cart.total)}</span>
                                </div>
                                <button onclick="placeOrder()" class="btn btn-success" style="width: 100%;">Complete Order & Pay</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div style="color: var(--danger);">Error loading checkout: ${e.message}</div>`;
            }
        }

        async function placeOrder() {
            const shippingAddress = document.getElementById('shippingAddress').value;
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            if (!shippingAddress.trim()) {
                showToast('Please provide a delivery address', 'error');
                return;
            }

            try {
                const res = await apiCall('/purchases/checkout', 'POST', { shippingAddress, paymentMethod });
                const order = res.data;
                showToast('Order created successfully!', 'success');
                renderHeader();
                setTimeout(() => {
                    window.location.href = `orders.html?newOrder=${order.orderNumber}`;
                }, 800);
            } catch (e) {
                showToast(e.message || 'Checkout transaction failed', 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', loadCheckoutPage);
    </script>
</body>
</html>
