<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Rahul Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Rahul<span class="logo-badge">MART</span>
            </a>
            <ul class="nav-links" id="navbar-links"></ul>
        </nav>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 1.5rem;">My Order History</h2>
        <div id="orders-container">
            <!-- Dynamically populated -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rahul Mart Multi-Vendor Marketplace</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        async function loadCustomerOrders() {
            const container = document.getElementById('orders-container');
            const user = await getCurrentUser();
            if (!user || user.role !== 'CUSTOMER') {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await apiCall('/purchases');
                const orders = res.data;

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 4rem;">
                            <h3>No Orders Placed Yet</h3>
                            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">You haven't placed any orders with Rahul Mart yet.</p>
                            <a href="index.html" class="btn btn-primary">Start Shopping</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div style="background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; overflow: hidden;">
                        <div style="background: var(--light-bg); padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
                            <div>
                                <span style="font-weight: 700; font-size: 1.1rem; color: var(--dark);">${o.orderNumber}</span>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">Placed on ${formatDate(o.createdAt)}</div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 1.5rem;">
                                <span class="badge badge-${o.status.toLowerCase()}">${o.status}</span>
                                <span style="font-size: 1.2rem; font-weight: 800; color: var(--primary);">${formatCurrency(o.totalAmount)}</span>
                            </div>
                        </div>
                        <div style="padding: 1.25rem 1.5rem;">
                            <div class="table-container" style="box-shadow: none; border: none; margin-bottom: 0;">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Category</th>
                                            <th>Vendor</th>
                                            <th>Qty</th>
                                            <th>Unit Price</th>
                                            <th>Subtotal</th>
                                            <th>Review</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${o.items.map(item => `
                                            <tr>
                                                <td style="font-weight: 600;">${escapeHtml(item.productName)}</td>
                                                <td>${escapeHtml(item.productCategory)}</td>
                                                <td>${escapeHtml(item.vendorName)}</td>
                                                <td>${item.quantity}</td>
                                                <td>${formatCurrency(item.unitPrice)}</td>
                                                <td style="font-weight: 700;">${formatCurrency(item.subtotal)}</td>
                                                <td>
                                                    ${o.status === 'DELIVERED' ? `
                                                        <a href="product-detail.html?id=${item.productId}#reviews" class="btn btn-secondary btn-sm">Write Review</a>
                                                    ` : '<span style="font-size: 0.8rem; color: var(--text-muted);">Delivered items only</span>'}
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div style="color: var(--danger); text-align: center;">Error loading orders: ${e.message}</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', loadCustomerOrders);
    </script>
</body>
</html>
