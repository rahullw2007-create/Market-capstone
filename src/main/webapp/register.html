<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Rahul Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Rahul<span class="logo-badge">MART</span>
            </a>
            <ul class="nav-links" id="navbar-links"></ul>
        </nav>
    </header>

    <div class="container">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Create my account</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Create your Rahul Mart account in a minute.</p>

            <form onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label for="fullName">Full Name / Store Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password (min. 6 characters)</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" class="form-control" required>
                        <option value="CUSTOMER">Customer (Browse & Purchase)</option>
                        <option value="VENDOR">Vendor (Sell & Manage Products)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create my account</button>
            </form>

            <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rahul Mart Multi-Vendor Marketplace</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
