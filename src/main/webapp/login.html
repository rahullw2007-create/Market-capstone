<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rahul Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Rahul<span class="logo-badge">MART</span>
            </a>
            <ul class="nav-links" id="navbar-links"></ul>
        </nav>
    </header>

    <div class="container">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Welcome back. Sign in to continue shopping.</p>

            <form onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                Don't have an account? <a href="register.html">Register here</a>
            </div>

            <!-- Demo Accounts Quick Fill Box -->
            <div class="demo-fill-box">
                <h4>Quick Demo Login (Password: <code>Demo1234!</code>)</h4>
                <div class="demo-buttons">
                    <button onclick="quickFill('admin@zenithbazaar.com')" class="btn btn-secondary btn-sm">Demo Admin</button>
                    <button onclick="quickFill('vendor1@techstore.com')" class="btn btn-secondary btn-sm">Demo Vendor 1 (Tech)</button>
                    <button onclick="quickFill('vendor2@fashionhub.com')" class="btn btn-secondary btn-sm">Demo Vendor 2 (Fashion)</button>
                    <button onclick="quickFill('customer1@gmail.com')" class="btn btn-secondary btn-sm">Demo Customer 1 (Alice)</button>
                    <button onclick="quickFill('customer2@yahoo.com')" class="btn btn-secondary btn-sm">Demo Customer 2 (Bob)</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rahul Mart Multi-Vendor Marketplace</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
